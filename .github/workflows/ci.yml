name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

  api-smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misplaceit
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Exercises the SQL itself. Queries are runtime-checked, so a typo in a
      # query only surfaces when it executes — a compile is not enough.
      - name: Run migrations and exercise every endpoint
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misplaceit
          JWT_SECRET: ci-secret-not-used-anywhere-real
          BIND_ADDR: 127.0.0.1:8080
        run: |
          cargo build
          ./target/debug/misplace-it &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          bash ../scripts/smoke.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose config --quiet

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bring the whole stack up and check it serves
        env:
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-secret-not-used-anywhere-real
          WEB_PORT: '8088'
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8088/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/api/v1/health
          # SPA fallback: a client-side route must serve the app shell, not 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/weight)" = 200
          docker compose down -v
