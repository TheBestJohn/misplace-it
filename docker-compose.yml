services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misplaceit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-misplaceit}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The API runs migrations on boot, so it must not start until Postgres is
      # genuinely accepting connections — not merely until the container exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misplaceit} -d ${POSTGRES_DB:-misplaceit}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-misplaceit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-misplaceit}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      USDA_API_KEY: ${USDA_API_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PHOTO_DIR: /data/photos
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      RUST_LOG: ${RUST_LOG:-misplace_it=info,tower_http=info,sqlx=warn}
    volumes:
      # Photo bytes live on disk rather than in Postgres, so they need their
      # own volume — and their own line in your backup routine.
      - photo-data:/data/photos
    # Not published to the host: only the web container needs to reach it.
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  db-data:
  photo-data:
